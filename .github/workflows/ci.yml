name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # WEDOS nabízí více verzí PHP 8; testujeme celý rozsah.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, curl, json
          coverage: none

      - name: Syntaxe PHP
        run: find src public tests config bin -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Instalace nástrojů pro testy
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Testy
        run: vendor/bin/phpunit
